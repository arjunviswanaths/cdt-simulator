<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaign Digital Twin · mock-up v4</title>
<meta name="description" content="A digital twin with a memory: simulates every disruption in a multi-vessel installation campaign and remembers every lesson. Mock-up with illustrative data.">
<style>
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#F9FAFC; --surface-3:#F2F3F8; --line:#E6E8F0; --line-2:#EEF0F5;
  --ink:#1D2333; --ink-2:#4A5367; --ink-3:#7A8298; --ink-4:#A3AABC;
  --brand:#5B5FC7; --brand-2:#4B4FB3; --brand-ink:#3F43A0; --brand-t:#EEEEFB; --brand-t2:#E3E3F8;
  /* data colours: pastel, validated orders (who pays: our, owner, weather, client | codes: P S W V N D) */
  --c-our:#DE7A93; --c-owner:#8F86DB; --c-weather:#7FAF6A; --c-client:#5C9FDB;
  --c-P:#3FAF96; --c-S:#9A8BDB; --c-W:#7FAF6A; --c-V:#5C9FDB; --c-N:#D4A23A; --c-D:#DE7A93;
  --c-wait:#B7BDCC; --c-twin:#5B5FC7;
  /* tints + inks for chips and badges */
  --rose-t:#FBEAEF; --rose-ink:#9C3956; --mint-t:#E3F4EE; --mint-ink:#226D5A; --sky-t:#E6F0FB; --sky-ink:#275D90;
  --lav-t:#EFEDFB; --lav-ink:#4E45A1; --butter-t:#FBF2DB; --butter-ink:#7A5C10; --sage-t:#ECF4E6; --sage-ink:#446D37;
  --peach-t:#FCEDE4; --peach-ink:#985027; --gray-t:#F0F1F5; --gray-ink:#555D70;
  --radius:16px; --radius-sm:11px; --shadow:0 1px 2px rgba(29,35,51,.04), 0 6px 20px rgba(29,35,51,.05);
  --shadow-lg:0 12px 40px rgba(29,35,51,.16);
  --font:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ font-family:var(--font); font-size:14px; line-height:1.45; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
button,input,select,textarea{ font:inherit; color:inherit; }
a{ color:var(--brand-ink); }
.num,.tnum{ font-variant-numeric:tabular-nums; }
.muted{ color:var(--ink-3); } .ink2{ color:var(--ink-2); } .small{ font-size:12px; } .xs{ font-size:11.5px; }
.nowrap{ white-space:nowrap; } .right{ text-align:right; } .center{ text-align:center; }
.hidden{ display:none !important; }

/* ---------- app shell */
.app{ display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh; }
.side{ position:sticky; top:0; height:100vh; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:18px 14px; gap:6px; }
.brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 16px; }
.brand-mark{ width:34px; height:34px; flex:none; }
.brand-name{ font-weight:650; font-size:14.5px; letter-spacing:-.01em; line-height:1.2; }
.brand-sub{ font-size:11.5px; color:var(--ink-3); }
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav button{ display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; padding:9px 10px; border-radius:10px; cursor:pointer; color:var(--ink-2); font-weight:500; text-align:left; }
.nav button svg{ width:18px; height:18px; flex:none; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.nav button:hover{ background:var(--surface-3); color:var(--ink); }
.nav button.on{ background:var(--brand-t); color:var(--brand-ink); }
.nav .count{ margin-left:auto; font-size:11px; padding:1px 7px; border-radius:99px; background:var(--surface-3); color:var(--ink-3); }
.nav button.on .count{ background:#fff; color:var(--brand-ink); }
.nav .sep{ height:1px; background:var(--line-2); margin:8px 6px; }
.side-foot{ margin-top:auto; padding:12px 10px 4px; border-top:1px solid var(--line-2); font-size:11.5px; color:var(--ink-3); line-height:1.5; }
.side-foot b{ color:var(--ink-2); font-weight:600; }
main{ min-width:0; }
.top{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; padding:12px 32px; background:rgba(245,246,250,.86); backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line-2); }
.crumb{ font-size:13px; color:var(--ink-3); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.crumb b{ color:var(--ink); font-weight:600; }
.crumb .dot{ width:4px; height:4px; border-radius:50%; background:var(--ink-4); }
.top .spacer{ flex:1; }
.view{ padding:24px 32px 64px; max-width:1520px; }
.view-head{ display:flex; align-items:flex-end; gap:16px; margin:2px 0 18px; flex-wrap:wrap; }
.view-head h1{ font-size:22px; line-height:1.25; margin:0; font-weight:650; letter-spacing:-.015em; }
.view-head p{ margin:4px 0 0; color:var(--ink-3); max-width:780px; }
.view-head .actions{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }

/* ---------- primitives */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; min-width:0; }
.card.flush{ padding:0; overflow:hidden; }
.card-h{ display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; }
.card-h > div:first-child{ flex:1; min-width:0; } .card-h .tools{ flex:none; }
.card-h h3{ margin:0; font-size:14.5px; font-weight:620; letter-spacing:-.005em; }
.card-h .sub{ font-size:12.5px; color:var(--ink-3); margin-top:2px; }
.card-h .tools{ margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.grid{ display:grid; gap:16px; }
.g2{ grid-template-columns:repeat(2,minmax(0,1fr)); } .g3{ grid-template-columns:repeat(3,minmax(0,1fr)); } .g4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
.g-7-5{ grid-template-columns:minmax(0,7fr) minmax(0,5fr); } .g-5-7{ grid-template-columns:minmax(0,5fr) minmax(0,7fr); } .g-8-4{ grid-template-columns:minmax(0,8fr) minmax(0,4fr); }
.stack{ display:flex; flex-direction:column; gap:16px; }
.row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.mt8{ margin-top:8px; } .mt12{ margin-top:12px; } .mt16{ margin-top:16px; } .mb8{ margin-bottom:8px; } .mb12{ margin-bottom:12px; }

.btn{ display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--surface); padding:7px 13px; border-radius:10px; cursor:pointer; font-weight:550; font-size:13px; color:var(--ink-2); transition:background .15s, border-color .15s, color .15s; white-space:nowrap; }
.btn:hover{ background:var(--surface-2); border-color:#D6D9E4; color:var(--ink); }
.btn svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.btn.primary{ background:var(--brand); border-color:var(--brand); color:#fff; }
.btn.primary:hover{ background:var(--brand-2); border-color:var(--brand-2); }
.btn.soft{ background:var(--brand-t); border-color:var(--brand-t); color:var(--brand-ink); }
.btn.soft:hover{ background:var(--brand-t2); }
.btn.sm{ padding:5px 10px; font-size:12px; border-radius:9px; }
.btn.ghost{ border-color:transparent; background:transparent; }
.btn.ghost:hover{ background:var(--surface-3); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

.chip{ display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:99px; font-size:11.5px; font-weight:550; background:var(--gray-t); color:var(--gray-ink); white-space:nowrap; line-height:1.6; }
.chip .sw{ width:8px; height:8px; border-radius:3px; }
.chip.rose{ background:var(--rose-t); color:var(--rose-ink); } .chip.mint{ background:var(--mint-t); color:var(--mint-ink); } .chip.sky{ background:var(--sky-t); color:var(--sky-ink); }
.chip.lav{ background:var(--lav-t); color:var(--lav-ink); } .chip.butter{ background:var(--butter-t); color:var(--butter-ink); } .chip.sage{ background:var(--sage-t); color:var(--sage-ink); }
.chip.peach{ background:var(--peach-t); color:var(--peach-ink); } .chip.line{ background:transparent; border:1px solid var(--line); color:var(--ink-2); }
.chip.code{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; letter-spacing:.01em; }
.dotk{ display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align:-1px; }

.seg{ display:inline-flex; background:var(--surface-3); border-radius:10px; padding:3px; gap:2px; }
.seg button{ border:0; background:transparent; padding:5px 11px; border-radius:8px; font-size:12.5px; font-weight:550; color:var(--ink-3); cursor:pointer; white-space:nowrap; }
.seg button.on{ background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(29,35,51,.08); }

.input,select.input,textarea.input{ width:100%; border:1px solid var(--line); border-radius:10px; padding:8px 11px; background:var(--surface); outline:none; transition:border-color .15s, box-shadow .15s; }
.input:focus{ border-color:#B9BBEA; box-shadow:0 0 0 3px var(--brand-t); }
textarea.input{ min-height:64px; resize:vertical; }
label.f{ display:block; font-size:12px; font-weight:550; color:var(--ink-2); }
label.f > .input, label.f > select, label.f > textarea, label.f > input{ display:block; margin-top:5px; }
label.f .req{ color:var(--rose-ink); }
label.f .hint{ display:block; font-weight:400; color:var(--ink-3); font-size:11.5px; margin-top:1px; }
.form-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 14px; }
.form-grid .full{ grid-column:1 / -1; }
.form-sec{ font-size:11.5px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); margin:18px 0 10px; display:flex; align-items:center; gap:8px; }
.form-sec:after{ content:""; flex:1; height:1px; background:var(--line-2); }
.checks{ display:flex; flex-wrap:wrap; gap:6px; }
.checks label{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border:1px solid var(--line); border-radius:99px; font-size:12px; cursor:pointer; background:var(--surface); font-weight:500; color:var(--ink-2); }
.checks input{ accent-color:var(--brand); }
.checks label:has(input:checked){ background:var(--brand-t); border-color:var(--brand-t2); color:var(--brand-ink); }

/* ---------- KPI tiles */
.kpis{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; }
.kpi{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:13px 15px; box-shadow:var(--shadow); min-width:0; }
.kpi .l{ font-size:11.5px; color:var(--ink-3); font-weight:550; letter-spacing:.01em; }
.kpi .v{ font-size:21px; font-weight:650; letter-spacing:-.02em; margin-top:3px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.kpi .s{ font-size:12px; color:var(--ink-3); margin-top:1px; }
.kpi.accent{ background:linear-gradient(160deg,#F3F2FD,#FFFFFF 70%); }

/* ---------- hero */
.hero{ position:relative; overflow:hidden; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:28px; padding:28px 30px; border-radius:22px; border:1px solid #E5E5F2;
  background:linear-gradient(118deg,#EEEDFC 0%,#ECF6F2 52%,#FDF1EB 100%); margin-bottom:16px; }
.hero:before{ content:""; position:absolute; right:-80px; top:-120px; width:340px; height:340px; border-radius:50%; background:radial-gradient(closest-side,rgba(255,255,255,.75),rgba(255,255,255,0)); }
.eyebrow{ font-size:11.5px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; color:var(--brand-ink); }
.hero h1{ font-size:30px; line-height:1.15; letter-spacing:-.025em; margin:8px 0 10px; font-weight:680; }
.hero p{ font-size:15px; color:var(--ink-2); margin:0 0 18px; max-width:560px; }
.hero-stats{ display:grid; grid-template-columns:1fr; gap:10px; position:relative; }
.hstat{ background:rgba(255,255,255,.78); border:1px solid rgba(255,255,255,.9); border-radius:14px; padding:12px 16px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 14px; align-items:center; box-shadow:0 1px 2px rgba(29,35,51,.04); }
.hstat .l{ font-size:12.5px; color:var(--ink-2); font-weight:550; }
.hstat .s{ font-size:11.5px; color:var(--ink-3); grid-column:1 / 2; }
.hstat .v{ grid-row:1 / 3; grid-column:2; font-size:22px; font-weight:680; letter-spacing:-.02em; font-variant-numeric:tabular-nums; white-space:nowrap; display:flex; align-items:center; gap:8px; }
.hstat .v .from{ color:var(--ink-4); font-weight:600; font-size:18px; }
.hstat .v .arrow{ color:var(--ink-4); font-size:15px; }

/* ---------- tables */
.tbl{ width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
.tbl th{ text-align:left; font-size:11.5px; font-weight:600; color:var(--ink-3); padding:8px 10px; border-bottom:1px solid var(--line); background:var(--surface-2); position:sticky; top:0; white-space:nowrap; }
.tbl td{ padding:9px 10px; border-bottom:1px solid var(--line-2); vertical-align:top; }
.tbl tr:last-child td{ border-bottom:0; }
.tbl tbody tr.click{ cursor:pointer; }
.tbl tbody tr.click:hover td{ background:var(--surface-2); }
.tbl tbody tr.sel td{ background:#F4F3FD; }
.tbl tbody tr.sel td:first-child{ box-shadow:inset 3px 0 0 var(--brand); }
.tbl .r{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.tbl input.rate{ width:96px; text-align:right; padding:5px 8px; border-radius:8px; }
.tbl-wrap{ overflow:auto; border-radius:12px; border:1px solid var(--line); }
.tbl-wrap .tbl th:first-child{ border-top-left-radius:12px; }

/* ---------- status & misc badges */
.pill{ display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:99px; font-size:11.5px; font-weight:600; white-space:nowrap; }
.pill:before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.75; }
.st-Open{ background:var(--rose-t); color:var(--rose-ink); } .st-In\ progress{ background:var(--butter-t); color:var(--butter-ink); }
.st-Implemented{ background:var(--sky-t); color:var(--sky-ink); } .st-Verified{ background:var(--mint-t); color:var(--mint-ink); } .st-Closed{ background:var(--gray-t); color:var(--gray-ink); }
.ty{ font-size:11px; font-weight:650; letter-spacing:.03em; text-transform:uppercase; }
.ty-Problem{ color:var(--rose-ink); } .ty-Good\ practice{ color:var(--mint-ink); } .ty-Safety{ color:var(--peach-ink); } .ty-Improvement{ color:var(--sky-ink); }
.repeat{ white-space:nowrap; display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; letter-spacing:.04em; color:#fff; background:#D06A86; padding:2px 8px; border-radius:6px; text-transform:uppercase; }
.repeat svg{ width:12px; height:12px; stroke:#fff; fill:none; stroke-width:2.2; }
.sev{ display:inline-flex; gap:2px; vertical-align:middle; }
.sev i{ width:6px; height:10px; border-radius:2px; background:var(--line); display:block; }
.sev i.on{ background:#E59AAE; }
.badge-rec{ font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 7px; border-radius:6px; background:var(--brand); color:#fff; white-space:nowrap; }
.badge-fast{ font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 7px; border-radius:6px; background:var(--mint-t); color:var(--mint-ink); white-space:nowrap; }
.badge-cheap{ font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 7px; border-radius:6px; background:var(--sky-t); color:var(--sky-ink); white-space:nowrap; }
.badge-block{ font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 7px; border-radius:6px; background:var(--gray-t); color:var(--gray-ink); white-space:nowrap; }
.badge-hse{ font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 7px; border-radius:6px; background:var(--peach-t); color:var(--peach-ink); white-space:nowrap; }

/* ---------- score bar */
.score{ display:flex; align-items:center; gap:8px; min-width:96px; }
.score .track{ flex:1; height:6px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
.score .fill{ height:100%; border-radius:99px; background:var(--brand); }
.score b{ font-variant-numeric:tabular-nums; font-size:13px; width:24px; text-align:right; }
.pillars{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
.pillar{ background:var(--surface-2); border:1px solid var(--line-2); border-radius:11px; padding:8px 10px; }
.pillar .k{ font-size:11px; color:var(--ink-3); font-weight:600; }
.pillar .v{ font-size:17px; font-weight:650; font-variant-numeric:tabular-nums; }
.pillar .t{ height:4px; border-radius:99px; background:var(--line); margin-top:5px; overflow:hidden; }
.pillar .t i{ display:block; height:100%; background:var(--brand); border-radius:99px; }

/* ---------- gantt (HTML, animated) */
.gantt{ position:relative; font-size:12px; user-select:none; min-width:760px; }
#sim-gantt, #camp-gantt{ overflow-x:auto; overflow-y:hidden; }
.g-head{ display:grid; grid-template-columns:150px minmax(0,1fr); }
.g-scale{ position:relative; height:34px; border-bottom:1px solid var(--line); }
.g-tick{ position:absolute; top:0; height:100%; border-left:1px solid var(--line-2); padding:3px 0 0 4px; color:var(--ink-3); font-size:10.5px; white-space:nowrap; }
.g-tick b{ display:block; color:var(--ink-2); font-weight:600; font-size:11px; }
.g-lane{ display:grid; grid-template-columns:150px minmax(0,1fr); border-bottom:1px solid var(--line-2); }
.g-lane:last-child{ border-bottom:0; }
.g-lab{ padding:9px 10px 9px 2px; display:flex; flex-direction:column; justify-content:center; gap:1px; min-width:0; }
.g-lab b{ font-weight:600; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.g-lab span{ font-size:11px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.g-lane.sys .g-lab b{ color:var(--ink-2); }
.g-track{ position:relative; background-image:linear-gradient(to right, var(--line-2) 1px, transparent 1px); background-size:var(--dayw) 100%; }
.g-bar{ position:absolute; height:24px; border-radius:7px; display:flex; align-items:center; padding:0 7px; gap:5px; overflow:hidden; white-space:nowrap; font-weight:550; font-size:11.5px; color:var(--ink);
  transition:left .55s cubic-bezier(.3,.7,.2,1), width .55s cubic-bezier(.3,.7,.2,1), top .35s ease, opacity .35s ease, background-color .35s ease; cursor:default; }
.g-bar .t{ overflow:hidden; text-overflow:ellipsis; }
.g-bar.n{ background:#E4E2FA; } .g-bar.c{ background:#F6CCD8; } .g-bar.sys{ background:#E2EEF9; color:var(--sky-ink); }
.g-bar.chg{ background:#CDEBDF; } .g-bar.chg.c{ background:#F3C3D1; }
.g-bar.mob{ background:repeating-linear-gradient(135deg,#DCEAF8 0 6px,#EEF5FC 6px 12px); color:var(--sky-ink); }
.g-bar.stop{ background:repeating-linear-gradient(135deg,#F4C2CF 0 6px,#FBE3EA 6px 12px); color:var(--rose-ink); z-index:2; font-weight:650; }
.g-bar.wx{ background:repeating-linear-gradient(135deg,#CFE3C5 0 6px,#EAF3E5 6px 12px); color:var(--sage-ink); z-index:2; font-weight:650; }
.g-bar.std{ background:repeating-linear-gradient(135deg,#E0DBF6 0 6px,#F1EEFC 6px 12px); color:var(--lav-ink); z-index:2; }
.g-bar.ghost{ background:transparent; border:1.5px dashed #C4C8D6; z-index:0; }
.g-bar.fresh{ animation:pop .5s ease; }
@keyframes pop{ from{ opacity:0; transform:scale(.96); } to{ opacity:1; transform:none; } }
.g-ll{ flex:none; display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:17px; padding:0 4px; border-radius:99px; background:#fff; color:var(--lav-ink); font-size:10.5px; font-weight:700; box-shadow:0 0 0 1px rgba(78,69,161,.15); cursor:pointer; }
.g-ll.open{ color:var(--rose-ink); box-shadow:0 0 0 1px rgba(156,57,86,.25); }
.g-mark{ position:absolute; top:0; bottom:0; width:0; border-left:1.5px dashed #9AA1B5; z-index:3; pointer-events:none; transition:left .55s cubic-bezier(.3,.7,.2,1); }
.g-mark span{ position:absolute; top:2px; left:4px; font-size:10.5px; font-weight:650; color:var(--ink-2); background:rgba(255,255,255,.92); padding:1px 5px; border-radius:5px; white-space:nowrap; }
.g-mark.contract{ border-left:2px solid #D06A86; } .g-mark.contract span{ color:var(--rose-ink); }
.g-mark.now{ border-left:2px solid var(--brand); } .g-mark.now span{ color:var(--brand-ink); }
.g-band{ position:absolute; top:0; bottom:0; background:rgba(143,134,219,.09); z-index:0; pointer-events:none; }
.g-band span{ position:absolute; bottom:2px; right:4px; font-size:10px; color:var(--lav-ink); font-weight:650; white-space:nowrap; }
.g-flags{ position:relative; height:40px; margin-left:150px; border-bottom:1px solid var(--line); }
.g-flag{ position:absolute; font-size:10.5px; font-weight:650; white-space:nowrap; padding:1px 7px; border-radius:6px; background:var(--surface-3); color:var(--ink-2); transition:left .55s cubic-bezier(.3,.7,.2,1), top .3s ease; line-height:16px; border-left:2px solid #9AA1B5; }
.g-flag.flip{ transform:translateX(-100%); border-left:0; border-right:2px solid #9AA1B5; }
.g-flag.contract{ background:var(--rose-t); color:var(--rose-ink); border-color:#D06A86; } .g-flag.now{ background:var(--brand-t); color:var(--brand-ink); border-color:var(--brand); }
.g-legend{ display:flex; flex-wrap:wrap; gap:14px; font-size:11.5px; color:var(--ink-3); margin-top:10px; }
.g-legend i{ display:inline-block; width:18px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }

/* ---------- charts */
.chart{ width:100%; display:block; overflow:visible; }
.chart text{ font-family:var(--font); }
.legend{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--ink-2); margin-top:6px; }
.legend span{ display:inline-flex; align-items:center; }
.tip{ position:fixed; z-index:200; pointer-events:none; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:12px; box-shadow:var(--shadow-lg); max-width:300px; opacity:0; transition:opacity .12s; }
.tip.on{ opacity:1; }
.tip b{ font-weight:650; }
.tip .tr{ display:flex; justify-content:space-between; gap:14px; }

/* ---------- simulate */
.sim{ display:grid; grid-template-columns:330px minmax(0,1fr); gap:16px; align-items:start; }
.sim > *, .stack > *{ min-width:0; }
.evlist{ display:flex; flex-direction:column; gap:8px; }
.evcard{ text-align:left; width:100%; border:1px solid var(--line); background:var(--surface); border-radius:13px; padding:10px 12px; cursor:pointer; display:grid; grid-template-columns:auto minmax(0,1fr); gap:3px 10px; transition:border-color .15s, background .15s, box-shadow .15s; }
.evcard:hover{ border-color:#D3D5EC; background:#FCFCFF; }
.evcard.on{ border-color:#BDBFEC; background:#F6F5FE; box-shadow:0 0 0 3px var(--brand-t); }
.evcard .id{ grid-row:1 / 3; width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; }
.evcard .tt{ font-weight:600; font-size:13px; line-height:1.3; }
.evcard .mm{ font-size:11.5px; color:var(--ink-3); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.impact{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; }
.impact .kpi{ box-shadow:none; background:var(--surface-2); }
.lesson-push{ border:1px solid #F1D6DE; background:linear-gradient(180deg,#FFF7F9,#FFFFFF 60%); }
.lrow{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; padding:10px 0; border-top:1px solid var(--line-2); align-items:start; }
.lrow:first-of-type{ border-top:0; }
.lrow .lid{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11.5px; color:var(--ink-3); padding-top:2px; }
.lrow .lt{ font-weight:600; font-size:13px; line-height:1.35; cursor:pointer; }
.lrow .lt:hover{ color:var(--brand-ink); }
.lrow .ld{ font-size:12px; color:var(--ink-2); margin-top:3px; }
.reqs{ display:flex; flex-direction:column; gap:6px; }
.req{ display:grid; grid-template-columns:18px minmax(0,1fr); gap:8px; font-size:12.5px; align-items:start; }
.req .ic{ width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-top:1px; }
.req .ic svg{ width:11px; height:11px; stroke:#fff; fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
.req.ready .ic{ background:#5DBB9F; } .req.lead .ic{ background:#D9AE4A; } .req.blocked .ic{ background:#D46F8A; }
.req .rt{ color:var(--ink-3); font-size:11.5px; }
.costs{ width:100%; font-size:12.5px; border-collapse:collapse; }
.costs td{ padding:5px 0; border-bottom:1px dashed var(--line); }
.costs td:last-child{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.costs tr.tot td{ border-bottom:0; font-weight:650; padding-top:8px; }
.callout{ border-radius:12px; padding:11px 13px; font-size:12.5px; display:flex; gap:10px; align-items:flex-start; }
.callout svg{ width:17px; height:17px; flex:none; margin-top:1px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.callout.rose{ background:var(--rose-t); color:var(--rose-ink); } .callout.peach{ background:var(--peach-t); color:var(--peach-ink); } .callout.sky{ background:var(--sky-t); color:var(--sky-ink); }
.callout.mint{ background:var(--mint-t); color:var(--mint-ink); } .callout.lav{ background:var(--lav-t); color:var(--lav-ink); } .callout.butter{ background:var(--butter-t); color:var(--butter-ink); }
.callout b{ font-weight:650; }
.compat{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; }
.compat .c{ border:1px solid var(--line-2); border-radius:11px; padding:9px 11px; background:var(--surface-2); font-size:12px; }
.compat .c b{ font-size:12.5px; }
.compat .c.ok{ background:var(--mint-t); border-color:#CDEBDF; }
.compat .c.slow{ background:var(--butter-t); border-color:#F2E3B8; }
.cascade{ display:flex; flex-direction:column; gap:4px; font-size:12.5px; }
.cascade .cr{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; padding:5px 0; border-bottom:1px dashed var(--line-2); }
.cascade .cr:last-child{ border-bottom:0; }
.timer{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--mint-ink); background:var(--mint-t); padding:3px 10px; border-radius:99px; font-weight:600; }
.timer svg{ width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2; }
.weights{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
.weights label{ font-size:11.5px; color:var(--ink-3); font-weight:600; display:flex; flex-direction:column; gap:4px; }
.weights input[type=range]{ accent-color:var(--brand); width:100%; }

/* ---------- lessons */
.ll-hero{ display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:24px; padding:24px 26px; border-radius:20px; background:linear-gradient(118deg,#FCEFF3 0%,#F3F0FC 55%,#EAF5F1 100%); border:1px solid #EDE4EE; margin-bottom:16px; }
.ll-hero h1{ font-size:27px; letter-spacing:-.025em; margin:8px 0 8px; line-height:1.15; font-weight:680; }
.ll-hero p{ margin:0; color:var(--ink-2); font-size:14.5px; max-width:560px; }
.ll-kpis{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; align-content:center; }
.ll-kpis .hk{ background:rgba(255,255,255,.8); border-radius:13px; padding:10px 13px; }
.ll-kpis .hk .v{ font-size:21px; font-weight:680; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.ll-kpis .hk .l{ font-size:11.5px; color:var(--ink-3); font-weight:550; }
.search{ position:relative; }
.search svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; stroke:var(--ink-3); fill:none; stroke-width:1.8; }
.search input{ padding:12px 14px 12px 42px; font-size:14.5px; border-radius:13px; }
.filters{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.filters select{ width:auto; padding:6px 10px; font-size:12.5px; border-radius:9px; }
.lcards{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.lcard{ border:1px solid var(--line); border-radius:14px; padding:13px 15px; background:var(--surface); cursor:pointer; display:flex; flex-direction:column; gap:7px; transition:border-color .15s, box-shadow .15s, transform .15s; }
.lcard:hover{ border-color:#D3D5EC; box-shadow:var(--shadow); transform:translateY(-1px); }
.lcard .top1{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.lcard .tl{ font-weight:620; font-size:13.5px; line-height:1.35; }
.lcard .ls{ font-size:12.5px; color:var(--ink-2); }
.lcard .meta{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:11.5px; color:var(--ink-3); }
.lcard mark, .lrow mark{ background:#FFF0B8; color:inherit; padding:0 1px; border-radius:3px; }
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; }
.tabs button{ border:0; background:none; padding:9px 13px 10px; font-weight:600; font-size:13px; color:var(--ink-3); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
.tabs button.on{ color:var(--brand-ink); border-bottom-color:var(--brand); }
.fieldtbl td:first-child{ white-space:nowrap; }
.push-k{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--brand-ink); background:var(--brand-t); padding:1px 6px; border-radius:5px; margin-left:6px; }
.fn-grid{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
.fn{ border:1px solid var(--line-2); border-radius:12px; padding:10px 12px; background:var(--surface-2); font-size:12px; color:var(--ink-2); }
.fn b{ display:block; color:var(--ink); font-size:12.5px; margin-bottom:3px; }
.pou-tasks{ display:flex; gap:6px; flex-wrap:wrap; }
.pou-tasks button{ border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:5px 11px; font-size:12.5px; cursor:pointer; color:var(--ink-2); font-weight:550; }
.pou-tasks button.on{ background:var(--brand); color:#fff; border-color:var(--brand); }
.pou-tasks button .n{ font-size:11px; opacity:.75; margin-left:4px; }
.brief-sheet{ border:1px solid var(--line); border-radius:16px; padding:18px 20px; background:linear-gradient(180deg,#FDFDFF,#fff); }

/* ---------- ops log */
.code-P{ background:#E1F3EE; color:#22705C; } .code-S{ background:#EEEAFB; color:#4E45A1; } .code-W{ background:#E9F3E3; color:#446D37; }
.code-V{ background:#E3EEFA; color:#275D90; } .code-N{ background:#FAF0D6; color:#7A5C10; } .code-D{ background:#FBE5EB; color:#9C3956; }
.opsrow td{ font-size:12.5px; }
.opsrow.hl td{ background:#FFF8FA; }
.daybar{ display:flex; height:30px; border-radius:9px; overflow:hidden; gap:2px; background:var(--surface); }
.daybar div{ height:100%; min-width:2px; }
.detect{ border:1px solid var(--line); border-radius:13px; padding:12px 14px; display:flex; flex-direction:column; gap:7px; background:var(--surface); }
.detect .dh{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.detect .dt{ font-weight:620; font-size:13px; }
.detect .dd{ font-size:12.5px; color:var(--ink-2); }

/* ---------- drawer & modal */
.scrim{ position:fixed; inset:0; background:rgba(29,35,51,.28); z-index:100; opacity:0; pointer-events:none; transition:opacity .2s; }
.scrim.on{ opacity:1; pointer-events:auto; }
.drawer{ position:fixed; top:0; right:0; bottom:0; width:min(560px,96vw); background:var(--surface); z-index:101; box-shadow:var(--shadow-lg); transform:translateX(102%); transition:transform .28s cubic-bezier(.3,.7,.2,1); display:flex; flex-direction:column; }
.drawer.on{ transform:none; }
.drawer .dh{ padding:18px 22px 14px; border-bottom:1px solid var(--line-2); display:flex; gap:12px; align-items:flex-start; }
.drawer .db{ padding:16px 22px 28px; overflow:auto; }
.drawer h2{ margin:4px 0 0; font-size:17px; line-height:1.3; font-weight:650; letter-spacing:-.01em; }
.xbtn{ margin-left:auto; border:0; background:var(--surface-3); width:30px; height:30px; border-radius:9px; cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center; }
.xbtn svg{ width:15px; height:15px; stroke:var(--ink-2); fill:none; stroke-width:2; }
.kv{ display:grid; grid-template-columns:150px minmax(0,1fr); gap:7px 14px; font-size:13px; }
.kv dt{ color:var(--ink-3); font-size:12px; font-weight:550; padding-top:1px; }
.kv dd{ margin:0; }
.dsec{ font-size:11.5px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); margin:18px 0 9px; }
.modal{ position:fixed; z-index:102; left:50%; top:50%; transform:translate(-50%,-48%) scale(.98); opacity:0; pointer-events:none; width:min(860px,94vw); max-height:90vh; background:var(--surface); border-radius:18px; box-shadow:var(--shadow-lg); display:flex; flex-direction:column; transition:opacity .2s, transform .2s; }
.modal.on{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%); }
.modal .mh{ padding:18px 24px 12px; display:flex; gap:12px; align-items:flex-start; border-bottom:1px solid var(--line-2); }
.modal .mh h2{ margin:0; font-size:18px; font-weight:650; letter-spacing:-.01em; }
.modal .mb{ padding:16px 24px; overflow:auto; }
.modal .mf{ padding:12px 24px 16px; border-top:1px solid var(--line-2); display:flex; gap:8px; justify-content:flex-end; align-items:center; }
.toast{ position:fixed; z-index:300; left:50%; bottom:26px; transform:translate(-50%,20px); opacity:0; background:#262B3D; color:#fff; padding:10px 16px; border-radius:12px; font-size:13px; box-shadow:var(--shadow-lg); transition:opacity .2s, transform .2s; pointer-events:none; max-width:560px; }
.toast.on{ opacity:1; transform:translate(-50%,0); }

/* ---------- about */
.flow{ display:grid; grid-template-columns:minmax(0,1fr) 40px minmax(0,1.1fr) 40px minmax(0,1fr); align-items:stretch; gap:0; }
.flow .col{ display:flex; flex-direction:column; gap:8px; }
.flow .box{ border:1px solid var(--line); border-radius:12px; padding:9px 12px; background:var(--surface); font-size:12.5px; }
.flow .box b{ display:block; font-size:12.5px; }
.flow .box span{ color:var(--ink-3); font-size:11.5px; }
.flow .core{ background:linear-gradient(160deg,#F1F0FD,#FFFFFF); border-color:#D9D8F4; height:100%; display:flex; flex-direction:column; gap:8px; }
.flow .arr{ display:flex; align-items:center; justify-content:center; color:var(--ink-4); }
.flow .arr svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; }
.prin{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; }
.prin .p{ border-radius:14px; padding:14px; border:1px solid var(--line); background:var(--surface); }
.prin .p .ic{ width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:8px; }
.prin .p .ic svg{ width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.prin .p b{ display:block; font-size:13.5px; margin-bottom:3px; }
.prin .p span{ font-size:12.5px; color:var(--ink-2); }
.road{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.road .s{ border-radius:14px; padding:14px; border:1px solid var(--line); background:var(--surface); position:relative; }
.road .s .ph{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--brand-ink); }
.road .s b{ display:block; margin:3px 0 6px; font-size:14px; }
.road .s ul{ margin:0; padding-left:17px; font-size:12.5px; color:var(--ink-2); }

/* ---------- responsive */
@media (max-width:1280px){ .kpis{ grid-template-columns:repeat(3,minmax(0,1fr)); } .impact{ grid-template-columns:repeat(3,minmax(0,1fr)); } .prin{ grid-template-columns:repeat(3,minmax(0,1fr)); } .fn-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (max-width:1100px){ .sim{ grid-template-columns:minmax(0,1fr); } .g-7-5,.g-5-7,.g-8-4,.g3{ grid-template-columns:minmax(0,1fr); } .hero,.ll-hero{ grid-template-columns:minmax(0,1fr); } .lcards{ grid-template-columns:minmax(0,1fr); } }
@media (max-width:820px){ .app{ grid-template-columns:minmax(0,1fr); } .side{ position:sticky; top:0; z-index:30; height:auto; padding:8px 10px; gap:2px; border-right:0; border-bottom:1px solid var(--line); } .brand{ padding:2px 4px 6px; } .side-foot{ display:none; } .nav{ flex-direction:row; flex-wrap:nowrap; overflow-x:auto; gap:4px; } .nav button{ width:auto; flex:none; padding:6px 10px; font-size:13px; } .nav .sep{ display:none; } .top{ display:none; } .view{ padding:16px; } .top{ padding:10px 16px; } .g2,.g4{ grid-template-columns:minmax(0,1fr); } .kpis{ grid-template-columns:repeat(2,minmax(0,1fr)); } .flow{ grid-template-columns:minmax(0,1fr); } .flow .arr{ transform:rotate(90deg); height:30px; } .road{ grid-template-columns:minmax(0,1fr); } .pillars{ grid-template-columns:repeat(3,minmax(0,1fr)); } .weights{ grid-template-columns:repeat(3,minmax(0,1fr)); } }

/* ---------- print: only the recovery brief */
@media print{
  body{ background:#fff; }
  .app,.scrim,.drawer,.toast,.tip,.modal .mh,.modal .mf{ display:none !important; }
  .modal{ position:static; transform:none !important; opacity:1 !important; box-shadow:none; width:100%; max-height:none; }
  .modal .mb{ overflow:visible; padding:0; }
  .brief-sheet{ border:0; padding:0; }
}

/* ---------- flowcharts: campaign task flow + recovery flow */
.flow-wrap,.sflow-wrap{ overflow-x:auto; margin:0 -6px; padding:2px 6px 4px; }
.flow{ position:relative; display:grid; column-gap:22px; row-gap:28px; padding:8px 14px 4px 24px; min-width:820px; }
.fl-lanebg{ background:var(--surface-2); border:1px solid var(--line-2); border-radius:14px; margin:-8px -9px -6px; z-index:0; }
.fl-lanebg.sys{ background:#F5F9FD; }
.fl-lh{ display:flex; align-items:center; gap:8px; padding:2px 0 0; z-index:2; min-width:0; }
.fl-lh > div{ min-width:0; }
.fl-lh b{ display:block; font-size:12.5px; font-weight:650; }
.fl-lh span{ display:block; font-size:11px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fl-li{ width:26px; height:26px; flex:none; border-radius:8px; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-2); }
.fl-li svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.fl-cell{ display:flex; flex-direction:column; gap:8px; justify-content:center; z-index:2; min-width:0; }
.fl-node{ display:flex; flex-direction:column; gap:4px; text-align:left; width:100%; border:1px solid #DCD9F6; background:#fff; border-radius:12px; padding:8px 10px; cursor:pointer; box-shadow:0 1px 2px rgba(29,35,51,.05); transition:box-shadow .15s, border-color .15s, opacity .2s; animation:flin .45s ease backwards; animation-delay:var(--d,0ms); }
.fl-node:hover{ box-shadow:0 0 0 3px rgba(91,95,199,.14), 0 6px 18px rgba(29,35,51,.10); border-color:var(--brand); }
.fl-node.c{ background:#FFF4F7; border-color:#F0BCCB; }
.fl-node.sys{ background:#F2F7FD; border-color:#CFE1F3; }
.fl-r1{ display:flex; align-items:flex-start; gap:6px; }
.fl-t{ flex:1; min-width:0; font-weight:620; font-size:12.5px; line-height:1.25; color:var(--ink); }
.fl-bd{ display:flex; align-items:center; gap:4px; flex:none; margin-top:-1px; }
.fl-bd:empty{ display:none; }
.fl-s{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11px; color:var(--ink-3); }
.fl-tag{ font-size:10px; font-weight:650; padding:0 6px; border-radius:99px; background:var(--lav-t); color:var(--lav-ink); white-space:nowrap; }
.fl-tag.c{ background:#FBE0E8; color:var(--rose-ink); }
.fl-m{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
.fl-m:empty{ display:none; }
.fl-chip{ font-size:10.5px; font-weight:550; padding:1px 6px; border-radius:99px; background:var(--gray-t); color:var(--gray-ink); white-space:nowrap; }
.fl-chip.hold{ background:var(--butter-t); color:var(--butter-ink); }
.fl-gate{ display:flex; align-items:center; gap:9px; padding:6px 4px; justify-content:center; animation:flin .45s ease backwards; animation-delay:var(--d,0ms); transition:opacity .2s; cursor:default; }
.fl-gate .dia{ width:16px; height:16px; flex:none; transform:rotate(45deg); border-radius:4px; background:var(--lav-t); border:1.6px solid #8F86DB; }
.fl-gate b{ display:block; font-size:11.5px; font-weight:650; color:var(--lav-ink); line-height:1.2; }
.fl-gate span{ display:block; font-size:10.5px; color:var(--ink-3); }
.fl-end{ display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:12px; background:linear-gradient(90deg,#E9F6F1,#F6FBF9); border:1px solid #C6E6D9; z-index:2; animation:flin .45s ease backwards; animation-delay:600ms; }

      var blocks = union(list.map(function(i){ return [i.from, i.to]; }));

/* Flowcharts: campaign task flow (Campaign & fleet) and recovery flow (Simulate).
   Nodes are HTML in a CSS grid; edges are SVG drawn from measured node boxes, so text wraps naturally

var FLOW_OBS = {};
var SVGNS = 'http://www.w3.org/2000/svg';
function flSvg(tag, attrs, parent){ var e = document.createElementNS(SVGNS, tag); for(var k in attrs) if(attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }

function flRound(pts, r){

  for(var i=1;i<p.length-1;i++){ var a = s[s.length-1], b = p[i], c = p[i+1];
    if((Math.abs(a[0]-b[0]) < 0.4 && Math.abs(b[0]-c[0]) < 0.4) || (Math.abs(a[1]-b[1]) < 0.4 && Math.abs(b[1]-c[1]) < 0.4)) continue; s.push(b); }

    var cur = s[j];
    if(j < s.length-1){
      var prev = s[j-1], nxt = s[j+1], d1 = Math.hypot(cur[0]-prev[0], cur[1]-prev[1]), d2 = Math.hypot(nxt[0]-cur[0], nxt[1]-cur[1]), rr = Math.min(r, d1/2, d2/2);

function taskFlowModel(E, ctx){

function parseCSV(text){
  var rows = [], row = [], cell = '', q = false;
  for(var i=0;i<text.length;i++){ var ch = text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch==='"') q = true; else if(ch===','){ row.push(cell); cell = ''; } else if(ch==='\n' || ch==='\r'){ if(ch==='\r' && text[i+1]==='\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += ch; }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return c.trim(); }); });
}

// ---------------------------------------------------------------- Decisions
V.decisions = function(){

  var applied = D.reduce(function(s,d){ return s + d.snap.option.proven.length; }, 0), drafts = D.filter(function(d){ return d.lessonDraft; }).length;
  var ms = D.length ? D.reduce(function(s,d){ return s + d.snap.ms; }, 0)/D.length : 0;
  h += '<div class="view-head"><div><h1>Decision log</h1><p>Every accepted recovery, with its evidence: the options considered, the lessons applied, who decided and why. This is how experience is captured instead of lost in phone calls and spreadsheets.</p></div><div class="actions"><button class="btn primary" data-go="simulate">'+ic('simulate')+'Simulate an event</button></div></div>';
  h += '<div class="kpis" style="grid-template-columns:repeat(5,minmax(0,1fr))">'
    + kpi('Decisions logged', D.length, D.filter(function(d){ return d.sample; }).length ? D.filter(function(d){ return d.sample; }).length+' are seeded examples' : '')
    + kpi('Saving vs. waiting', money(saving), 'Our cost, all logged decisions')
    + kpi('Days recovered', fd(days), 'Against waiting for repair')
    + kpi('Lessons applied', applied, drafts+' new lesson drafts captured')
    + kpi('Time to ranked plan', D.length ? Math.max(1, Math.round(ms))+' ms' : '-', 'Average, this mock (pilot measures it live)')
    + '</div>';

  h += '<div class="card flush mt16"><div class="tbl-wrap" style="border:0"><table class="tbl"><thead><tr><th>ID</th><th>Logged</th><th>Event</th><th>Decision</th><th>By</th><th class="r">Days lost</th><th class="r">Saving</th><th>Lessons</th><th>RCA</th><th></th></tr></thead><tbody>'
    + D.map(function(d){ var o = d.snap.option, e = d.snap.ev;
      return '<tr><td class="nowrap"><span class="chip code">'+esc(d.id)+'</span>'+(d.sample ? ' <span class="chip">example</span>' : '')+'</td><td class="nowrap small">'+esc(d.at)+'</td><td><div style="font-weight:600">'+esc(e.title)+'</div><div class="row" style="gap:5px;margin-top:3px">'+codeChip(e.code)+ownerChip(e.owner)+'</div></td>'
        + '<td><div style="font-weight:600">'+esc(o.name)+'</div><div class="row" style="gap:5px;margin-top:3px">'+(o.recommended ? '<span class="badge-rec">Recommended</span>' : '<span class="chip butter">Override</span>')+'</div><div class="xs muted mt8">'+esc(d.rationale||'')+'</div></td>'
        + '<td class="small nowrap">'+esc(d.by)+'</td><td class="r small">'+fd(d.snap.impact.daysLost)+' → <b>'+fd(o.daysLost)+'</b></td><td class="r" style="color:var(--mint-ink);font-weight:650">'+money(Math.max(0, o.saving))+'</td>'
        + '<td class="small">'+(o.proven.length ? o.proven.map(function(id){ return '<a href="#" data-act="lesson" data-id="'+id+'" class="chip mint" style="text-decoration:none">'+id+'</a>'; }).join(' ') : '<span class="muted">-</span>')+(d.lessonDraft ? '<div class="mt8"><a href="#" data-act="lesson" data-id="'+d.lessonDraft+'" class="chip butter" style="text-decoration:none">+ '+d.lessonDraft+' draft</a></div>' : '')+'</td>'
        + '<td>'+(d.rca ? '<span class="chip rose">required</span>' : '<span class="chip">no</span>')+'</td><td><button class="btn sm" data-act="decbrief" data-id="'+d.id+'">'+ic('file')+'Brief</button></td></tr>'; }).join('')

function snapshotFor(A, key){
  var ev = A.ev, o = A.options.filter(function(x){ return x.key===key; })[0], I = A.impact;
  return { at:nowStamp(), ev:{ id:ev.id, title:ev.title, short:ev.short, text:ev.text, code:ev.code, owner:ev.owner.def, asset:assetName(ev.asset), task:taskById(ev.task).short, onset:dlab(A.t0)+' '+hhmm(A.t0), p:ev.probability },
    impact:{ daysLost:I.daysLost, finish:I.finish, otd:I.otd.status, company:I.buckets.company, client:I.buckets.client, owner:I.buckets.owner, weather:I.buckets.weather, our:I.ourCost, windowLost:!!I.windowLost },
    option:{ key:o.key, name:o.name, desc:o.desc, reqs:o.reqs, costs:o.costs, total:o.total, remainingOur:o.remaining.ourCost, client:o.remaining.client, owner:o.remaining.owner, daysLost:o.daysLost, daysSaved:o.daysSaved, finish:o.finish, otd:o.otd.status, late:o.otd.late,
      risk:o.risk, hazards:o.hazards, hseGate:o.hseGate, scores:o.scores, score:o.score, saving:o.netSaving, lesson:o.lesson, proven:o.proven, caution:o.caution, parts:o.parts, recommended:o.key===A.recommended },
    lessons:A.lessons.slice(0, 8).map(function(m){ return { id:m.L.id, title:m.L.title, repeat:m.repeat, owner:m.L.actionOwner, due:m.L.due }; }), ms:A.ms, evaluated:A.evaluated, weights:clone(S.weights) };
}
function seedDecisions(){
  if(S.seeded || S.decisions.length) { S.seeded = true; return; }
  [['E5','Project manager','Air-freight approved; the ROV crew ran the as-built survey of the laid flowline during the wait.','2027-04-11 08:10', true], ['E2','Offshore manager','Spare TMS on board; ROV-2 surveyed the laid flowline while ROV-1 was repaired.','2027-04-14 13:10', false]].forEach(function(x, i){
    var A = C.analyse(C.scenarioById(x[0]), { weights:S.weights, lessons:S.lessons }); if(!A.recommended) return;
    var snap = snapshotFor(A, A.recommended); snap.at = x[3];
    S.decisions.push({ id:'DEC-00'+(i+1), at:x[3], by:x[1], rationale:x[2], rca:x[4], push:true, snap:snap, lessonDraft:null, sample:true });
  });
  S.decisions.reverse(); S.seeded = true; save();
}

    + '</div></div>';
  var P = [['shield','Guardrails, not autopilot','Unsafe options are blocked or gated, with the reason shown. Easier to do right, harder to get wrong.','var(--peach-t)','var(--peach-ink)'],
    ['user','Humans in control','The twin ranks and explains. The offshore and project managers decide and sign.','var(--lav-t)','var(--lav-ink)'],
    ['eye','No black box','Every number traces to a rate, a rule or a record. No invented figures.','var(--sky-t)','var(--sky-ink)'],
    ['brain','People leave, experience stays','Decisions and lessons are captured with their reasons, for the next engineer.','var(--rose-t)','var(--rose-ink)'],
    ['layers','Built on what exists','Schedule, ops log and lessons register are inputs. It runs inside the company’s own cloud, Azure or AWS.','var(--mint-t)','var(--mint-ink)']];
  h += '<div class="prin mt16">'+P.map(function(p){ return '<div class="p"><div class="ic" style="background:'+p[3]+';color:'+p[4]+'">'+ic(p[0])+'</div><b>'+p[1]+'</b><span>'+p[2]+'</span></div>'; }).join('')+'</div>';
  h += '<div class="grid g2 mt16"><div class="card"><div class="card-h"><div><h3>What the pilot measures</h3><div class="sub">Only what can be measured on one campaign. Bigger claims wait for the data.</div></div></div><table class="costs">'
    + [['Time to a ranked recovery plan','manual baseline vs. twin, per event'],['Recoverable idle days identified','fleet days, priced at contract rates'],['Lessons surfaced and applied','per decision; repeat risks caught'],['Schedule-update delay','days from offshore decision to master schedule'],['Claimable standby notified on time','share of standby hours with a notice within 24 h']].map(function(r){ return '<tr><td><b style="font-weight:600">'+r[0]+'</b></td><td class="muted" style="text-align:right">'+r[1]+'</td></tr>'; }).join('')
    + '</table><div class="callout butter mt12">'+ic('alert')+'<div>Shorter campaigns and lower cost of non-quality are expected results of these, measured from Year 2. They are not promised by the pilot.</div></div></div>';

    + '<div class="callout mint">'+ic('check')+'<div><b>Rules decide:</b> critical path, costs, capability checks, guardrails, scoring. Same input, same answer, every time.</div></div>'
    + '<div class="callout sky">'+ic('file')+'<div><b>AI reads:</b> procedures, ITPs and log text into tags and readiness checks, reviewed by an engineer before use.</div></div>'
    + '<div class="callout lav">'+ic('target')+'<div><b>Learning from coded history:</b> repair durations and event probabilities estimated from coded ops logs as campaigns accumulate.</div></div>'

function openPouPrint(){ var c = $('.g-8-4 > .card'); if(!c) return; openModal('Pre-job brief', '<div class="brief-sheet">'+c.innerHTML+'</div>', '<button class="btn" data-act="close">Close</button>'+printBtn()+'', true); }
function refreshOptions(){ var c = $('#opt-card'); if(c) c.innerHTML = optionsTableHTML(); var d = $('#opt-detail'); if(d) d.innerHTML = optionDetailHTML(); drawSimFlow(true); drawUpdFlow(); }
var wTimer = null;
document.addEventListener('click', function(e){
  var g = e.target.closest('[data-go]');
  if(g){ e.preventDefault(); closeAll(); go(g.getAttribute('data-go')); return; }
  var a = e.target.closest('[data-act]'); if(!a) return;
  if(a.tagName==='SELECT' || (a.tagName==='INPUT' && a.type!=='button') || a.tagName==='TEXTAREA') return;
  var act = a.getAttribute('data-act'), id = a.getAttribute('data-id'), v = a.getAttribute('data-v'), k = a.getAttribute('data-k');

  if(act.indexOf('lesson:')===0){ lessonDrawer(act.slice(7)); return; }

    case 'close': closeAll(); break;
    case 'ev': S.sim.custom = null; S.sim.evId = id; runSim(); break;
    case 'runcustom': var b = S.sim.b; S.sim.custom = C.makeCustom({ asset:b.asset, mode:b.mode, task:b.task, hours:+b.hours, onsetH:+b.onsetH, probability:(+b.probability||10)/100, cnq:+b.cnq||0, gateDay:+b.gateDay }); runSim();
      toast('Custom event simulated: '+esc(S.sim.custom.title.replace('Custom: ',''))); break;

    case 'sort': S.sim.sort = v; refreshOptions(); break;
    case 'weights': S.sim.showW = !S.sim.showW; refreshOptions(); break;
    case 'showall': S.sim.showAll = !S.sim.showAll; refreshOptions(); break;
    case 'accept': acceptForm(); break;
    case 'confirmaccept': confirmAccept(); break;
    case 'brief': openBrief(snapshotFor(S.sim.A, S.sim.sel)); break;
    case 'print': if(FRAMED){ var mb = $('#modal .mb'); copyText(mb ? mb.innerText : '', 'Brief'); } else window.print(); break;
    case 'notice': openModal('Standby notice (draft)', noticeHTML(), '<button class="btn" data-act="close">Close</button>'+printBtn()+'', true); break;
    case 'lesson': lessonDrawer(id); break;
    case 'task': taskDrawer(id); break;

    case 'resetrates': S.assets.forEach(function(x){ var d = C.DEFAULT_ASSETS.filter(function(y){ return y.id===x.id; })[0]; if(d) x.rate = d.rate; }); syncEngine(); save(); render(); toast('Default day rates restored.'); break;
    case 'lltab': S.ll.tab = v; render(); break;
